name: Compile SA-MP Gamemode

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Include Files
        run: |
          mkdir -p ./includes
          unzip -q include.zip -d ./includes
          if [ -d "./includes/include" ]; then mv ./includes/include/* ./includes/; fi

      - name: Setup Pawn Compiler
        uses: Southclaws/action-pawncc@v1
        with:
          version: 3.10.10

      - name: Compile ZOmbieNPC.pwn
        run: pawncc ZOmbieNPC.pwn -i./includes -oZOmbieNPC.amx -;+ -(+

      - name: Upload Compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: ZOmbieNPC-amx
          path: ZOmbieNPC.amx
