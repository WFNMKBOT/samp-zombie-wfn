name: Compile SA-MP Gamemode

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pawn Compiler, Includes & FCNPC
        run: |
          mkdir -p compiler/include output/plugins output/gamemodes

          # 1. Ambil include standar SA-MP 0.3.7 dari repositori resmi
          git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git /tmp/samp-stdlib
          cp -r /tmp/samp-stdlib/*.inc compiler/include/

          # 2. Download Pawn Compiler (pawncc) Linux terbaru
          curl -L -s https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz -o pawnc.tar.gz
          tar -xzf pawnc.tar.gz
          cp pawnc-3.10.10-linux/bin/pawncc compiler/
          cp pawnc-3.10.10-linux/lib/libpawnc.so compiler/
          chmod +x compiler/pawncc

          # 3. Download FCNPC v2.0.5 (Include + Plugin Linux sinkron)
          curl -L -s https://github.com/ziggi/FCNPC/releases/download/2.0.5/FCNPC-2.0.5-linux.tar.gz -o fcnpc.tar.gz
          tar -xzf fcnpc.tar.gz
          cp pawno/include/FCNPC.inc compiler/include/
          cp plugins/FCNPC.so output/plugins/

      - name: Compile zombie_npc.pwn
        run: |
          LD_LIBRARY_PATH=./compiler ./compiler/pawncc zombie_npc.pwn -ooutput/gamemodes/zombie_npc.amx -icompiler/include -;+ -(+

      - name: Upload Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: samp-zombie-files
          path: output/
