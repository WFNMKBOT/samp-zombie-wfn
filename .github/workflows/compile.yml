name: Compile SA-MP Gamemode

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Include Files
        run: |
          mkdir -p ./includes
          unzip -q include.zip -d ./includes
          # Pindahkan semua file .inc dan subfolder YSI yang bersarang ke root ./includes
          find ./includes -name "*.inc" -exec cp -n {} ./includes/ \;
          # Unduh standar include SA-MP 0.3.7-R2 jika belum ada di include.zip
          if [ ! -f "./includes/a_samp.inc" ]; then
            curl -sL https://github.com/pawn-lang/samp-stdlib/archive/refs/heads/master.zip -o stdlib.zip
            unzip -q stdlib.zip -d ./stdlib_tmp
            cp -n ./stdlib_tmp/samp-stdlib-master/*.inc ./includes/
          fi

      - name: Download Pawn Compiler
        run: |
          curl -sL https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz -o pawnc.tar.gz
          tar -xzf pawnc.tar.gz
          chmod +x pawnc-3.10.10-linux/bin/pawncc

      - name: Compile ZOmbieNPC.pwn
        run: |
          export LD_LIBRARY_PATH=$PWD/pawnc-3.10.10-linux/lib:$LD_LIBRARY_PATH
          ./pawnc-3.10.10-linux/bin/pawncc ZOmbieNPC.pwn -i./includes -oZOmbieNPC.amx "-;+" "-(+"

      - name: Upload Compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: ZOmbieNPC-amx
          path: ZOmbieNPC.amx
