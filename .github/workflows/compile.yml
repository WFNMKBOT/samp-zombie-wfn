name: Compile SA-MP Gamemode

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Pawn Compiler
        run: |
          curl -sL https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz -o pawnc.tar.gz
          tar -xzf pawnc.tar.gz
          chmod +x pawnc-3.10.10-linux/bin/pawncc

      - name: Prepare Include Files
        run: |
          mkdir -p ./includes
          # Unduh standar include SA-MP lengkap (a_samp, core, float, string, dll.)
          curl -sL https://github.com/pawn-lang/samp-stdlib/archive/refs/heads/master.zip -o stdlib.zip
          unzip -q stdlib.zip -d ./stdlib_tmp
          cp -rn ./stdlib_tmp/samp-stdlib-master/* ./includes/
          # Ekstrak include.zip dari repository Anda
          unzip -q include.zip -d ./includes_tmp
          find ./includes_tmp -name "*.inc" -exec cp -n {} ./includes/ \;
          if [ -d "./includes_tmp/YSI" ]; then cp -rn ./includes_tmp/YSI ./includes/; fi
          if [ -d "./includes_tmp/include" ]; then cp -rn ./includes_tmp/include/* ./includes/; fi

      - name: Compile ZOmbieNPC.pwn
        run: |
          export LD_LIBRARY_PATH=$PWD/pawnc-3.10.10-linux/lib:$LD_LIBRARY_PATH
          ./pawnc-3.10.10-linux/bin/pawncc ZOmbieNPC.pwn -i./includes -oZOmbieNPC.amx "-;+" "-(+"

      - name: Upload Compiled AMX
        uses: actions/upload-artifact@v4
        with:
          name: ZOmbieNPC-amx
          path: ZOmbieNPC.amx
