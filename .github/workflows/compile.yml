name: Compile SA-MP Gamemode

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pawn Compiler, Includes & FCNPC
        run: |
          set -e
          mkdir -p compiler/include output/plugins output/gamemodes

          # 1. Include standar SA-MP 0.3.7
          git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git /tmp/samp-stdlib
          cp -r /tmp/samp-stdlib/*.inc compiler/include/

          # 2. Ambil URL asli rilis terbaru Pawn Compiler Linux dari API GitHub
          PAWNC_URL=$(curl -s https://api.github.com/repos/pawn-lang/compiler/releases/latest | grep "browser_download_url.*linux\.tar\.gz" | cut -d '"' -f 4 | head -n 1)
          echo "Downloading Pawn Compiler: $PAWNC_URL"
          curl -fL "$PAWNC_URL" -o pawnc.tar.gz
          tar -xzf pawnc.tar.gz --strip-components=1 -C compiler/
          chmod +x compiler/bin/pawncc

          # 3. Ambil URL asli rilis terbaru FCNPC Linux dari API GitHub
          FCNPC_URL=$(curl -s https://api.github.com/repos/ziggi/FCNPC/releases/latest | grep "browser_download_url.*linux\.tar\.gz" | cut -d '"' -f 4 | head -n 1)
          echo "Downloading FCNPC: $FCNPC_URL"
          curl -fL "$FCNPC_URL" -o fcnpc.tar.gz
          mkdir -p /tmp/fcnpc
          tar -xzf fcnpc.tar.gz -C /tmp/fcnpc
          find /tmp/fcnpc -name "FCNPC.inc" -exec cp {} compiler/include/ \;
          find /tmp/fcnpc -name "FCNPC.so" -exec cp {} output/plugins/ \;

      - name: Compile zombie_npc.pwn
        run: |
          LD_LIBRARY_PATH=./compiler/lib ./compiler/bin/pawncc zombie_npc.pwn -ooutput/gamemodes/zombie_npc.amx -icompiler/include -;+ -(+

      - name: Upload Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: samp-zombie-files
          path: output/
